version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop_inventory_web
    restart: always
    # We removed the published ports for the 'web' service.
    # It is now only accessible internally by Caddy.
    expose:
      - '3000'
    env_file:
      - .env.local

  caddy:
    image: caddy:2-alpine
    container_name: shop_inventory_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
