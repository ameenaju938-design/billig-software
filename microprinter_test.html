<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microprinter Configuration & Test Bench</title>
  <script src="printer_config.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .preview-box {
      background: #ffffff;
      color: #000;
      padding: 16px;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      margin-top: 16px;
      min-height: 150px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #0369a1;
      color: #e0f2fe;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container no-print">
    <h1>🖨️ Microprinter Configuration & Test Bench</h1>
    <p>Configure thermal receipt microprinters (58mm / 80mm) and sticker label printers (100x25mm / 50x25mm).</p>

    <!-- Profile Selector -->
    <div class="card">
      <div class="grid">
        <div>
          <label>Select Microprinter Profile</label>
          <select id="profileSelect" onchange="updateProfile()">
            <option value="58mm_thermal">58mm Thermal Microprinter (POS Receipt)</option>
            <option value="80mm_thermal">80mm Thermal POS Receipt Printer</option>
            <option value="label_100x25">100mm x 25mm Thermal Label Sticker</option>
            <option value="label_50x25">50mm x 25mm Single Barcode Tag</option>
          </select>
        </div>
        <div>
          <label>Current Status</label>
          <div style="padding-top: 8px;">
            <span class="badge" id="statusBadge">Active Profile: 58mm Thermal</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Store Info & Printer Settings -->
    <div class="card">
      <h3 style="margin-top:0; color:#f1f5f9;">Store Header & Printer Settings</h3>
      <div class="grid">
        <div>
          <label>Store Name</label>
          <input type="text" id="storeName" value="AL AIN BOUTIQUE" oninput="saveConfig()">
        </div>
        <div>
          <label>Phone Number</label>
          <input type="text" id="storePhone" value="+91 9876543210" oninput="saveConfig()">
        </div>
        <div>
          <label>Address</label>
          <input type="text" id="storeAddress" value="Main Street, City Center" oninput="saveConfig()">
        </div>
        <div>
          <label>Tax ID / GSTIN</label>
          <input type="text" id="storeTaxId" value="GSTIN123456789" oninput="saveConfig()">
        </div>
      </div>
    </div>

    <!-- Live Preview & Test Print Actions -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0; color: #f1f5f9;">Live Print Preview</h3>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-secondary" onclick="renderPreview()">🔄 Refresh Preview</button>
          <button class="btn" onclick="triggerMicroprint()">🖨️ Print Test</button>
        </div>
      </div>
      <div id="previewArea" class="preview-box">
        <!-- Rendered print output goes here -->
      </div>
    </div>
  </div>

  <script>
    const printer = new MicroprinterManager();

    function updateProfile() {
      const selected = document.getElementById('profileSelect').value;
      printer.setProfile(selected);
      document.getElementById('statusBadge').innerText = 'Active Profile: ' + printer.getActiveProfile().name;
      renderPreview();
    }

    function saveConfig() {
      printer.config.storeInfo.name = document.getElementById('storeName').value;
      printer.config.storeInfo.phone = document.getElementById('storePhone').value;
      printer.config.storeInfo.address = document.getElementById('storeAddress').value;
      printer.config.storeInfo.taxId = document.getElementById('storeTaxId').value;
      renderPreview();
    }

    function renderPreview() {
      const profile = printer.getActiveProfile();
      let html = '';
      if (profile.type === 'receipt') {
        html = printer.renderReceiptHTML({
          invoiceNo: "INV-88492",
          date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
          items: [
            { name: "Silk Shawl Black", price: 1500, qty: 1 },
            { name: "Cotton Dupatta", price: 450, qty: 2 }
          ],
          total: 2400
        });
      } else {
        html = printer.renderLabelHTML({
          code: "SH-0001",
          price: 1500,
          color: "BLACK",
          size: "XL",
          material: "NIDHA"
        });
      }
      document.getElementById('previewArea').innerHTML = html;
    }

    function triggerMicroprint() {
      const profile = printer.getActiveProfile();
      let html = '';
      if (profile.type === 'receipt') {
        html = printer.renderReceiptHTML({
          invoiceNo: "INV-88492",
          date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
          items: [
            { name: "Silk Shawl Black", price: 1500, qty: 1 },
            { name: "Cotton Dupatta", price: 450, qty: 2 }
          ],
          total: 2400
        });
      } else {
        html = printer.renderLabelHTML({
          code: "SH-0001",
          price: 1500,
          color: "BLACK",
          size: "XL",
          material: "NIDHA"
        });
      }
      printer.print(html);
    }

    // Initialize on load
    window.onload = function() {
      renderPreview();
    };
  </script>
</body>
</html>
